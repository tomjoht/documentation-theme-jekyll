repository: tomjoht/documentation-theme-jekyll

output: web
# this property is useful for conditional filtering of content that is separate from the PDF.

topnav_title: Jekyll Documentation Theme
# this appears in the top navigation bar, next to the logo

topnav_subtitle: A theme for technical documentation
# optional. this appears in smaller text below the title in the top navigation bar. delete it if you don't want a subtitle.

# topnav_logo: images/logo.svg
# optional. an image to show instead of the book icon in the top navigation bar. use a path relative to the site root or a full URL.

breadcrumbs: true
# shows a breadcrumb trail (product > folder > page) above each page title, based on where the page appears in its sidebar. set to false to hide breadcrumbs.

site_title: Jekyll theme for documentation
# this appears in the html browser tab for the site title (seen mostly by search engines, not users)

company_name: Google LLC
# this appears in the footer after the copyright symbol and year, such as "©2026 Google LLC. All rights reserved."

github_editme_path: tomjoht/documentation-theme-jekyll/blob/gh-pages/
# if you're using Github, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.

# gitlab_editme_path: your-group/your-project/-/blob/main/
# if you're using GitLab.com, comment out github_editme_path, uncomment this line, and provide the basepath to the branch you've created for reviews.

# google_analytics: G-XXXXXXXXXX
# if you have a Google Analytics 4 measurement ID (it starts with G-), uncomment the previous line and put it in. Universal Analytics IDs (UA-) no longer collect data.

company_logo: images/company_logo.png
# the logo in the footer. use a path relative to the site root or a full URL. set to false to hide the logo.

# project_version: 7.0
# if a sidebar file doesn't set a version, the sidebar shows this value next to the product name instead. this lets you keep the version in one place.

sidebar_expand_controls: false
# set to true to show Collapse All | Expand All links at the top of the sidebar.

host: 127.0.0.1
# the preview server used. Leave as is.

port: 4000
# the port where the preview is rendered. You can leave this as is unless you have other Jekyll builds using this same port that might cause conflicts. in that case, use another port such as 4006.

exclude:
  - .idea/
  - .gitignore
  - .github/
  - .gitlab-ci.yml
  - .vscode/
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSE-BSD-NAVGOCO.txt
  - Dockerfile
  - docker-compose.yml
  - "*.sh"
  - createtag
  - var/
# these are the files and directories that jekyll will exclude from the build

feedback_subject_line: Jekyll documentation theme

feedback_email: tomjoht@gmail.com
# used as a contact email for the Feedback link in the top navigation bar

# feedback_disable: true
# if you uncomment the previous line, the Feedback link gets removed

# feedback_text: "Need help?"
# if you uncomment the previous line, it changes the Feedback text

# feedback_link: "http://helpy.io/"
# if you uncomment the previous line, it changes where the feedback link points to

theme: null
# GitHub Pages applies its default Primer theme unless you turn it off. This theme doesn't use it, and its assets/css/style.scss file can cause "Invalid US-ASCII character" build errors.

highlighter: rouge
# library used for syntax highlighting

markdown: kramdown
kramdown:
 input: GFM
 auto_ids: true
 hard_wrap: false
 syntax_highlighter: rouge

# filter used to process markdown. note that kramdown differs from github-flavored markdown in some subtle ways

collections:
  tooltips:
    output: false
# collections are declared here. this renders the content in _tooltips and processes it, but doesn't output it as actual files in the output unless you change output to true

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: true
      # comments appear only if you configure giscus below. to hide comments on a page, set comments: false in its front matter.
      search: true
      sidebar: home_sidebar
      topnav: topnav
  -
    scope:
      path: ""
      type: "tooltips"
    values:
      layout: "page"
      search: true
      tooltip: true

  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      search: true
      sidebar: home_sidebar
      topnav: topnav

# these are defaults used for the frontmatter for these file types

sidebars:
- home_sidebar
- mydoc_sidebar
- product1_sidebar
- product2_sidebar
- other

description: "Intended as a documentation theme based on Jekyll for technical writers documenting software and other technical products, this theme has all the elements you would need to handle multiple products with both multi-level sidebar navigation, tags, and other documentation features."
# the description is used in the feed.xml file

# giscus:
#   repo: your-username/your-repo
#   repo_id: R_xxxxxxxxxx
#   category: Comments
#   category_id: DIC_xxxxxxxxxxxxxxx
# to add comments to pages and posts, enable GitHub Discussions on your repo, get these values from https://giscus.app, and uncomment the giscus block.

# needed for sitemap.xml file only
# url: http://idratherbewriting.com
# baseurl: /documentation-theme-jekyll


github: [metadata]


