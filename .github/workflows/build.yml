name: Build

# Checks that the site still builds. GitHub Pages publishes the site
# separately from the gh-pages branch.
on:
  push:
    branches: [gh-pages]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
